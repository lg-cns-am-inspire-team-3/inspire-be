spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3307/inspireteam?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password: 1004
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
      pool-name: hikari_primary_pool

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

    properties:
      hibernate:
        format-sql: true

    defer-datasource-initialization: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081

front:
  redirect:
    url: "http://localhost:3000"

management:
  health:
    redis:
      enabled: false